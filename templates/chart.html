{% extends "base.html" %}
{% block title %}{{ title }} - Zynthian Live Session{% end %}
{% block content %}
<div class="container">
    {% raw chart_body %}
</div>
{% end %}
{% block script %}
{% if play_along_mode %}
<script>
    (function() {
        var bar = document.querySelector('.play-along-bar');
        if (!bar) return;
        var status = bar.querySelector('.pa-status');
        var gig = bar.getAttribute('data-gig-id');
        var track = bar.getAttribute('data-track-idx');

        function post(url) {
            status.textContent = '';
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                if (xhr.status === 200) return;
                var error = '';
                try { error = JSON.parse(xhr.responseText).error || ''; } catch (e) {}
                status.textContent = error || 'Request failed';
            };
            xhr.onerror = function() { status.textContent = 'MPD unreachable'; };
            xhr.send('{}');
        }

        bar.addEventListener('click', function(e) {
            var btn = e.target.closest('button');
            if (!btn || btn.disabled) return;
            var action = btn.getAttribute('data-action');
            if (action === 'play') {
                post('/api/play-along/play/' + gig + '/' + track);
            } else {
                post('/api/mpd/' + action);
            }
        });
    })();
</script>
{% end %}
{% end %}
